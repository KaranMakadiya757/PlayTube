<svg
  width="300"
  height="96"
  viewBox="0 0 300 96"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3366FF" />
      <stop offset="100%" stop-color="#FF0033" />
    </linearGradient>

    <linearGradient id="playtubeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(0,2) scale(0.18)">
    <rect
      x="66"
      y="116"
      width="380"
      height="280"
      rx="90"
      ry="90"
      fill="none"
      stroke="url(#logoGradient)"
      stroke-width="18"
    />
    <path d="M225,215 L285,256 L225,297 Z" fill="url(#logoGradient)" />
    <path
      d="M225,195 L310,256 L225,317"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- TEXT -->
  <text
    x="104"
    y="64"
    fill="url(#playtubeGradient)"
    font-size="40"
    font-weight="700"
    font-family="Roboto, Inter, sans-serif"
    letter-spacing="-0.5px"
  >
    Play
  </text>

  <text
    x="188"
    y="64"
    fill="url(#playtubeGradient)"
    font-size="40"
    font-weight="700"
    font-family="Roboto, Inter, sans-serif"
    letter-spacing="-0.5px"
  >
    Tube
  </text>
</svg>
